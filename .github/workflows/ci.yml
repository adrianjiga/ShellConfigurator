name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  coverage:
    name: Coverage (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matches the engines floor: every supported version is actually verified.
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          # getNerdFontsDir, the brew branch, and the fc-cache skip are darwin-only.
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  distro-smoke:
    name: Distro smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            package-manager: apt
          - image: debian:bookworm-slim
            package-manager: apt
          - image: fedora:41
            package-manager: dnf
          - image: archlinux:latest
            package-manager: pacman
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run non-destructive smoke test in ${{ matrix.image }}
        # The build is explicit: docker-smoke.mjs imports from dist/, which would
        # otherwise exist only as a side effect of npm ci running the prepare script.
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            -e EXPECTED_PM=${{ matrix.package-manager }} \
            ${{ matrix.image }} \
            bash -euxo pipefail -c "bash scripts/ci/distro-setup.sh && HOME=/tmp/smoke-home npm ci && HOME=/tmp/smoke-home npm run build && HOME=/tmp/smoke-home node scripts/docker-smoke.mjs"
