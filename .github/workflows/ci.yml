name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: v24.22.2

jobs:
  # One matrix job instead of four copy-pasted check jobs: lint, format:check,
  # typecheck, and build are all "checkout the repo, npm ci, run a script".
  quality-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, "format:check", typecheck, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  # Aggregates the quality checks into one required check so the master ruleset
  # stays stable when a step is added or renamed.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-checks]
    if: ${{ always() }}
    steps:
      - run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ]; then
            echo "Quality checks ended as ${{ needs.quality-checks.result }}."
            exit 1
          fi
          echo "All quality checks passed."

  # macOS cannot run the Linux Docker matrix, so it gets a native sibling job in
  # the same smoke group: same build + scratch-HOME smoke entrypoint, including a
  # real headless apply (brew installs Starship; rc/config writes stay in /tmp).
  macos-smoke:
    name: Distro smoke (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: macOS headless smoke
        run: HOME=/tmp/macos-smoke-home node scripts/ci/macosSmoke.mjs

  distro-smoke:
    name: Distro smoke (${{ matrix.package-manager }}, ${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            package-manager: apt
            setup: true
            finalize: true
            wizard-check: true
          - image: debian:bookworm-slim
            package-manager: apt
            setup: true
            finalize: true
            wizard-check: true
          - image: fedora:44
            package-manager: dnf
            setup: true
            finalize: true
            wizard-check: true
          - image: archlinux:latest
            package-manager: pacman
            setup: true
            finalize: true
            wizard-check: true
          - image: alpine:latest
            package-manager: apk
            # Alpine ships no bash; install it before the harness starts.
            setup: apk add --no-cache bash
            finalize: true
            wizard-check: true
          - image: debian:bookworm-slim
            package-manager: brew
            setup: mkdir -p /usr/local/bin && printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/brew && chmod +x /usr/local/bin/brew
            finalize: true
            wizard-check: true
          - image: debian:bookworm-slim
            package-manager: script
            setup: true
            finalize: sed -i s/^ID=debian/ID=smoke/ /etc/os-release && mv /usr/bin/apt-get /usr/bin/apt-get.disabled
            wizard-check: HOME=/tmp/smoke-home node scripts/ci/wizardSmoke.mjs && HOME=/tmp/smoke-home node scripts/ci/headlessGenerateSmoke.mjs && HOME=/tmp/smoke-home node scripts/ci/headlessApplySmoke.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/node-tarball-cache
          key: node-${{ runner.arch }}-${{ env.NODE_VERSION }}
      - name: Run the smoke test in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          SETUP: ${{ matrix.setup }}
          FINALIZE: ${{ matrix.finalize }}
          WIZARD_CHECK: ${{ matrix.wizard-check }}
        run: |
          bash scripts/ci/distroSmoke.sh "$IMAGE" "$PACKAGE_MANAGER" "$SETUP" "$FINALIZE" "$WIZARD_CHECK"
