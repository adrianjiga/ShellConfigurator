name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

env:
  NODE_VERSION: v22.23.2

jobs:
  # One matrix job instead of four copy-pasted check jobs: lint, format:check,
  # typecheck, and build are all "checkout the repo, npm ci, run a script".
  quality-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format:check, typecheck, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  # Aggregates the quality checks into one required check so the master ruleset
  # stays stable when a step is added or renamed.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [quality-checks]
    steps:
      - run: echo "All quality checks passed."

  distro-smoke:
    name: Distro smoke (${{ matrix.package-manager }}, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            package-manager: apt
            setup: true
            finalize: true
            wizard-check: true
          - image: debian:bookworm-slim
            package-manager: apt
            setup: true
            finalize: true
            wizard-check: true
          - image: fedora:41
            package-manager: dnf
            setup: true
            finalize: true
            wizard-check: true
          - image: archlinux:latest
            package-manager: pacman
            setup: true
            finalize: true
            wizard-check: true
          - image: alpine:latest
            package-manager: apk
            # Alpine ships no bash; install it before the harness starts.
            setup: apk add --no-cache bash
            finalize: true
            wizard-check: true
          - image: debian:bookworm-slim
            package-manager: brew
            setup: mkdir -p /usr/local/bin && printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/brew && chmod +x /usr/local/bin/brew
            finalize: true
            wizard-check: true
          - image: debian:bookworm-slim
            package-manager: script
            setup: true
            finalize: sed -i s/^ID=debian/ID=smoke/ /etc/os-release && mv /usr/bin/apt-get /usr/bin/apt-get.disabled
            wizard-check: HOME=/tmp/smoke-home node scripts/ci/wizardSmoke.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/node-tarball-cache
          key: node-${{ runner.arch }}-${{ env.NODE_VERSION }}
          restore-keys: node-${{ runner.arch }}-
      - name: Run non-destructive smoke test in ${{ matrix.image }}
        run: |
          bash scripts/ci/distroSmoke.sh \
            "${{ matrix.image }}" \
            "${{ matrix.package-manager }}" \
            "${{ matrix.setup }}" \
            "${{ matrix.finalize }}" \
            "${{ matrix.wizard-check }}"
