name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # Aggregates the lint/format/typecheck/build jobs into one required check so
  # the master ruleset stays stable when a step is added or renamed.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, build]
    steps:
      - run: echo "All quality checks passed."

  distro-smoke:
    name: Distro smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            package-manager: apt
            setup: true
          - image: debian:bookworm-slim
            package-manager: apt
            setup: true
          - image: fedora:41
            package-manager: dnf
            setup: true
          - image: archlinux:latest
            package-manager: pacman
            setup: true
          - image: alpine:latest
            package-manager: apk
            # Alpine ships no bash; install it before the harness starts.
            setup: apk add --no-cache bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run non-destructive smoke test in ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD":/app:ro \
            -w /app \
            -e EXPECTED_PM=${{ matrix.package-manager }} \
            -e SHELL=/bin/bash \
            ${{ matrix.image }} \
            sh -eu -c "${{ matrix.setup }} && bash -euxo pipefail -c 'bash scripts/ci/distro-setup.sh && cp -a /app /tmp/src && cd /tmp/src && HOME=/tmp/smoke-home npm ci && HOME=/tmp/smoke-home npm run build && HOME=/tmp/smoke-home node scripts/docker-smoke.mjs'"
