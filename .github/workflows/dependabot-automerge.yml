name: Dependabot auto-merge

on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch-level dev-dep updates
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          skip-commit-verification: true # "Update branch" rebases rewrite Dependabot's commits, losing the verified signature
      # Only patch bumps of development deps (biome, vitest, ...) are auto-merged.
      # typescript compiles the shipped dist/, so its bumps always get a review.
      - name: Enable auto-merge for patch-level dev-dependency bumps
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          !contains(steps.metadata.outputs.dependency-names, 'typescript')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "$PR_URL"
