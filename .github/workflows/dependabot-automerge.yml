name: Dependabot auto-merge

on:
  pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch-level dev-dep updates
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      # Only patch bumps of development deps (biome, vitest, typescript, ...) are
      # auto-merged. `build(deps-dev):` pins the PR to the dev-dependency group, so
      # a production-dep regressions can never slip in without review.
      - name: Enable auto-merge for patch-level dev-dependency bumps
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' && startsWith(github.event.pull_request.title, 'build(deps-dev):') }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "$PR_URL"