name: Release

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  publish:
    name: Publish to npm + GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
      # npm 12 disables install scripts (breaks esbuild postinstall); Node 22
      # ships an older npm, so upgrade here.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --silent keeps prepare output off stdout so only the tarball name lands
      # in GITHUB_ENV.
      - name: Package release tarball
        run: echo "artifact=$(npm pack --silent --ignore-scripts)" >> "$GITHUB_ENV"
      # Stage defers 2FA to a later npm stage approve; no NODE_AUTH_TOKEN so
      # npm uses the OIDC exchange.
      - name: Stage on npm (OIDC)
        shell: bash
        run: |
          set -o pipefail
          npm stage publish --provenance --access public --ignore-scripts --loglevel verbose 2>&1 | tee /tmp/publish.log
      - if: failure()
        id: publish-diag
        name: Dump npm diagnostics
        run: grep -iE "oidc|exchange|ENEEDAUTH|trusted|401|403|approve|stage" /tmp/publish.log || true
      - name: Create GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
