name: Release

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  publish:
    name: Publish to npm + GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      # npm 12 disables install scripts (breaks esbuild postinstall); Node 22
      # ships an older npm, so upgrade here.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --silent keeps prepare output off stdout so only the tarball name lands
      # in GITHUB_ENV.
      - name: Package release tarball
        run: echo "artifact=$(npm pack --silent --ignore-scripts)" >> "$GITHUB_ENV"
      # Smoke-boots the packed tarball: guards against a release that extracts
      # but cannot launch (e.g. missing bundled dependencies).
      - name: Verify tarball boots
        run: |
          tmp=$(mktemp -d)
          tar -xzf "${{ env.artifact }}" -C "$tmp"
          node "$tmp/package/dist/index.js" --version
          rm -rf "$tmp"
      # OIDC trusted publishing: npm negotiates a short-lived token from the
      # ACTIONS_ID_TOKEN_REQUEST_URL. No NODE_AUTH_TOKEN is set so the exchange
      # is used. Stage defers 2FA to a later maintainer approval.
      - name: Stage on npm (OIDC)
        shell: bash
        run: |
          set -o pipefail
          npm stage publish --provenance --access public --ignore-scripts
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
