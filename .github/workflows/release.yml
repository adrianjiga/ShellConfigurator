name: Release

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  publish:
    name: Publish to npm + GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
      # Provenance via OIDC trusted publishing needs npm >= 11.5.1. Node 22
      # ships an older npm, so upgrade the CLI here rather than at publish
      # time. Pin to the 11.x line: npm 12 flips install scripts off by
      # default, which would break esbuild's platform-binary postinstall.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # npm pack names the tarball shell-configurator-<version>.tgz; the curl
      # installer looks up the same asset in the GitHub release body. --silent
      # keeps the prepare script's lifecycle output off stdout so the captured
      # value is the tarball filename and nothing else.
      - name: Package release tarball
        run: echo "artifact=$(npm pack --silent)" >> "$GITHUB_ENV"
      # OIDC trusted publishing: npm negotiates a short-lived token from the
      # ACTIONS_ID_TOKEN_REQUEST_URL. No NODE_AUTH_TOKEN is set so npm CLI does
      # not skip the OIDC exchange, and the --provenance flag attaches Sigstore
      # attestations linking this build back to the source.
      - name: Publish to npm (OIDC)
        run: npm publish --provenance --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
