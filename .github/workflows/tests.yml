name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum supported LTS and the current major.
        os: [ubuntu-latest]
        node: ["24", "26"]
        include:
          # getNerdFontsDir, the brew branch, and the fc-cache skip are darwin-only.
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage

  # Aggregates the coverage matrix into one required check so the master
  # ruleset stays stable when a matrix entry is added or removed.
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [coverage]
    if: ${{ always() }}
    steps:
      - run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage jobs ended as ${{ needs.coverage.result }}."
            exit 1
          fi
          echo "All coverage checks passed."
