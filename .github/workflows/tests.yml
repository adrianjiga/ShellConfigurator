name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  coverage:
    name: Coverage (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matches the engines floor: every supported version is actually verified.
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          # getNerdFontsDir, the brew branch, and the fc-cache skip are darwin-only.
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  # Aggregates the coverage matrix into one required check so the master
  # ruleset stays stable when a matrix entry is added or removed.
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [coverage]
    steps:
      - run: echo "All coverage checks passed."
