# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$username$directory$git_branch$git_status$fill$time\n$character"
add_newline  = true
palette      = "muted"

[username]
show_always = false
style_user  = "bold username"
style_root  = "bold err"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = "on "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[time]
style  = "bold time"
disabled    = false
time_format = "%H:%M"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.muted]
fg             = "#1c1c1c"
ok             = "#8faf8f"
err            = "#cc8a8a"
username       = "#9a8f7a"
hostname       = "#8faf8f"
directory      = "#7f9abf"
git_branch     = "#a08fbf"
git_status     = "#cc8a8a"
nodejs         = "#8faf8f"
python         = "#bfae7f"
rust           = "#bf8f7f"
docker_context = "#7f9abf"
kubernetes     = "#7fb0b0"
aws            = "#bfae7f"
time           = "#8a8a8a"
battery        = "#8faf8f"
cmd_duration   = "#9a9a8a"
jobs           = "#7f9abf"
