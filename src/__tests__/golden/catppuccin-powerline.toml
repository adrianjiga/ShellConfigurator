# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$username$directory$git_branch$git_status$fill$nodejs$python$cmd_duration\n$character"
add_newline  = true
palette      = "catppuccin"

[username]
format = "([ $user ]($style)[](fg:username bg:directory))"
show_always = false
style_user  = "bold fg:fg bg:username"
style_root  = "bold fg:fg bg:err"

[directory]
style  = "bold fg:fg bg:directory"
format = "([ $path$read_only ]($style)[](fg:directory bg:git_branch))"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold fg:fg bg:git_branch"
format = "([ $symbol$branch ]($style)[](fg:git_branch bg:git_status))"
symbol = " "

[git_status]
style  = "bold fg:fg bg:git_status"
format = "([ $all_status$ahead_behind ]($style)[](fg:git_status))"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold fg:fg bg:nodejs"
format = "([](fg:nodejs)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[python]
style  = "bold fg:fg bg:python"
format = "([](fg:python bg:nodejs)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold fg:fg bg:cmd_duration"
format = "([](fg:cmd_duration bg:python)[ $duration ]($style))"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.catppuccin]
fg             = "#1e1e2e"
ok             = "#a6e3a1"
err            = "#f38ba8"
username       = "#fab387"
hostname       = "#f9e2af"
directory      = "#89b4fa"
git_branch     = "#cba6f7"
git_status     = "#f38ba8"
nodejs         = "#a6e3a1"
python         = "#f9e2af"
rust           = "#fab387"
docker_context = "#89dceb"
kubernetes     = "#94e2d5"
aws            = "#f9e2af"
time           = "#bac2de"
battery        = "#a6e3a1"
cmd_duration   = "#f9e2af"
jobs           = "#cba6f7"
