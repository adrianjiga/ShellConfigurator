# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$directory$git_branch$git_status\n$character"
add_newline  = true
palette      = "default"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = "on "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[palettes.default]
fg             = "black"
ok             = "green"
err            = "red"
username       = "yellow"
hostname       = "green"
directory      = "blue"
git_branch     = "purple"
git_status     = "red"
nodejs         = "green"
python         = "yellow"
rust           = "red"
docker_context = "blue"
kubernetes     = "cyan"
aws            = "yellow"
time           = "white"
battery        = "yellow"
cmd_duration   = "yellow"
jobs           = "blue"
