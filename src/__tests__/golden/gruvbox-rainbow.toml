# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format              = "$username$hostname$directory$git_branch$git_status[](fg:prev_bg)$fill$nodejs$rust$cmd_duration\n$character"
continuation_prompt = "[∙](bright-black) "
add_newline         = true
palette             = "gruvbox"

[username]
format = "([ $user ]($style))"
show_always = false
style_user  = "bold fg:fg bg:username"
style_root  = "bold fg:fg bg:err"

[hostname]
style  = "bold fg:fg bg:hostname"
format = "([](fg:prev_bg bg:hostname)[ $ssh_symbol$hostname ]($style))"
ssh_only = true

[directory]
style  = "bold fg:fg bg:directory"
format = "([](fg:prev_bg bg:directory)[  $path$read_only ]($style))"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold fg:fg bg:git_branch"
format = "([](fg:prev_bg bg:git_branch)[ $symbol$branch ]($style))"
symbol = " "

[git_status]
style  = "bold fg:fg bg:git_status"
format = "([](fg:prev_bg bg:git_status)[ $all_status$ahead_behind ]($style))"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold fg:fg bg:nodejs"
format = "([](fg:nodejs bg:prev_bg)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[rust]
style  = "bold fg:fg bg:rust"
format = "([](fg:rust bg:prev_bg)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold fg:fg bg:cmd_duration"
format = "([](fg:cmd_duration bg:prev_bg)[ $duration ]($style))"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.gruvbox]
fg             = "#282828"
ok             = "#b8bb26"
err            = "#fb4934"
