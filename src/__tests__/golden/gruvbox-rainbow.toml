# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$username$hostname$directory$git_branch$git_status$fill$nodejs$rust$cmd_duration\n$character"
add_newline  = true
palette      = "gruvbox"

[username]
format = "([ $user ]($style)[](fg:username bg:hostname))"
show_always = false
style_user  = "bold fg:fg bg:username"
style_root  = "bold fg:fg bg:err"

[hostname]
style  = "bold fg:fg bg:hostname"
format = "([ $ssh_symbol$hostname ]($style)[](fg:hostname bg:directory))"
ssh_only = true

[directory]
style  = "bold fg:fg bg:directory"
format = "([ $path$read_only ]($style)[](fg:directory bg:git_branch))"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold fg:fg bg:git_branch"
format = "([ $symbol$branch ]($style)[](fg:git_branch bg:git_status))"
symbol = " "

[git_status]
style  = "bold fg:fg bg:git_status"
format = "([ $all_status$ahead_behind ]($style)[](fg:git_status))"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold fg:fg bg:nodejs"
format = "([](fg:nodejs)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[rust]
style  = "bold fg:fg bg:rust"
format = "([](fg:rust bg:nodejs)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold fg:fg bg:cmd_duration"
format = "([](fg:cmd_duration bg:rust)[ $duration ]($style))"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.gruvbox]
fg             = "#282828"
ok             = "#b8bb26"
err            = "#fb4934"
username       = "#fe8019"
hostname       = "#fabd2f"
directory      = "#83a598"
git_branch     = "#d3869b"
git_status     = "#fb4934"
nodejs         = "#b8bb26"
python         = "#fabd2f"
rust           = "#fe8019"
docker_context = "#83a598"
kubernetes     = "#8ec07c"
aws            = "#fabd2f"
time           = "#a89984"
battery        = "#b8bb26"
cmd_duration   = "#fabd2f"
jobs           = "#d3869b"
