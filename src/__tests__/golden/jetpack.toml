# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$directory$git_branch$git_status$fill$cmd_duration$time\n$character"
add_newline  = true
palette      = "jetpack"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = " "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[cmd_duration]
style  = "bold cmd_duration"
min_time = 0

[time]
style  = "bold time"
disabled    = false
time_format = "%H:%M"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.jetpack]
fg             = "#0b1a1a"
ok             = "#26c6a2"
err            = "#ef5f6b"
username       = "#7fd1c1"
hostname       = "#5ec8c8"
directory      = "#26c6a2"
git_branch     = "#8ab4f8"
git_status     = "#ef5f6b"
nodejs         = "#7ed957"
python         = "#f5c542"
rust           = "#f57a42"
docker_context = "#5ec8c8"
kubernetes     = "#5ec8c8"
aws            = "#f5c542"
time           = "#7a8f8f"
battery        = "#26c6a2"
cmd_duration   = "#f5c542"
jobs           = "#8ab4f8"
