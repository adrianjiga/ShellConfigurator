# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$username$hostname$directory$git_branch$git_status$fill$nodejs$python$rust$cmd_duration\n$character"
add_newline  = true
palette      = "vivid"

[username]
show_always = false
style_user  = "bold username"
style_root  = "bold err"

[hostname]
style  = "bold hostname"
ssh_only = true

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = " "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold nodejs"
symbol   = " "
disabled = false

[python]
style  = "bold python"
symbol   = " "
disabled = false

[rust]
style  = "bold rust"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold cmd_duration"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.vivid]
fg             = "black"
ok             = "bright-green"
err            = "bright-red"
username       = "bright-yellow"
hostname       = "bright-green"
directory      = "bright-blue"
git_branch     = "bright-purple"
git_status     = "bright-red"
nodejs         = "bright-green"
python         = "bright-yellow"
rust           = "bright-red"
docker_context = "bright-blue"
kubernetes     = "bright-cyan"
aws            = "bright-yellow"
time           = "bright-white"
battery        = "bright-green"
cmd_duration   = "bright-yellow"
jobs           = "bright-blue"
