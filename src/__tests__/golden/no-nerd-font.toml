# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format              = "$directory$git_branch$git_status$fill$cmd_duration\n$character"
continuation_prompt = "[∙](bright-black) "
add_newline         = true
palette             = "terminal"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = "on "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[cmd_duration]
style  = "bold cmd_duration"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.terminal]
fg             = "black"
ok             = "green"
err            = "red"
username       = "white"
hostname       = "white"
directory      = "blue"
git_branch     = "purple"
git_status     = "red"
nodejs         = "green"
python         = "yellow"
rust           = "red"
docker_context = "blue"
kubernetes     = "cyan"
aws            = "yellow"
time           = "white"
battery        = "green"
cmd_duration   = "white"
jobs           = "blue"
status         = "red"
os             = "cyan"
shlvl          = "purple"
sudo           = "yellow"
git_commit     = "purple"
golang         = "cyan"
java           = "red"
dotnet         = "blue"
ruby           = "red"
php            = "yellow"
c              = "green"
cpp            = "red"
zig            = "yellow"
lua            = "cyan"
swift          = "purple"
elixir         = "purple"
