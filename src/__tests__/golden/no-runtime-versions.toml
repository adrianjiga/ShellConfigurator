# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$directory$git_branch$git_status\n$character"
add_newline  = true
palette      = "slate"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = "on "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[palettes.slate]
fg             = "#0f172a"
ok             = "#38bdf8"
err            = "#f43f5e"
username       = "#94a3b8"
hostname       = "#94a3b8"
directory      = "#38bdf8"
git_branch     = "#818cf8"
git_status     = "#f43f5e"
nodejs         = "#64748b"
python         = "#64748b"
rust           = "#64748b"
docker_context = "#7dd3fc"
kubernetes     = "#7dd3fc"
aws            = "#94a3b8"
time           = "#64748b"
battery        = "#38bdf8"
cmd_duration   = "#94a3b8"
jobs           = "#818cf8"
