# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$username$directory$git_branch$git_status$fill$nodejs$python$cmd_duration$time\n$character"
add_newline  = true
palette      = "pastel"

[username]
format = "([ $user ]($style)[](fg:username bg:directory))"
show_always = false
style_user  = "bold fg:fg bg:username"
style_root  = "bold fg:fg bg:err"

[directory]
style  = "bold fg:fg bg:directory"
format = "([ $path$read_only ]($style)[](fg:directory bg:git_branch))"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold fg:fg bg:git_branch"
format = "([ $symbol$branch ]($style)[](fg:git_branch bg:git_status))"
symbol = " "

[git_status]
style  = "bold fg:fg bg:git_status"
format = "([ $all_status$ahead_behind ]($style)[](fg:git_status))"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold fg:fg bg:nodejs"
format = "([](fg:nodejs)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[python]
style  = "bold fg:fg bg:python"
format = "([](fg:python bg:nodejs)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold fg:fg bg:cmd_duration"
format = "([](fg:cmd_duration bg:python)[ $duration ]($style))"
min_time = 0

[time]
style  = "bold fg:fg bg:time"
format = "([](fg:time bg:cmd_duration)[ $time ]($style))"
disabled    = false
time_format = "%H:%M"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.pastel]
fg             = "#2e2e3e"
ok             = "#a8e6a1"
err            = "#ffadad"
username       = "#ffd6a5"
hostname       = "#caffbf"
directory      = "#a0c4ff"
git_branch     = "#bdb2ff"
git_status     = "#ffadad"
nodejs         = "#caffbf"
python         = "#fdffb6"
rust           = "#ffc6a5"
docker_context = "#9bf6ff"
kubernetes     = "#a0e7e5"
aws            = "#fdffb6"
time           = "#d8d8e8"
battery        = "#caffbf"
cmd_duration   = "#fdffb6"
jobs           = "#bdb2ff"
