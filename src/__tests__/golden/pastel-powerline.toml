# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format              = "$username$directory$git_branch$git_status[](fg:prev_bg)$fill$nodejs$python$cmd_duration$time\n$character"
continuation_prompt = "[∙](bright-black) "
add_newline         = true
palette             = "pastel"

[username]
format = "([ $user ]($style))"
show_always = false
style_user  = "bold fg:fg bg:username"
style_root  = "bold fg:fg bg:err"

[directory]
style  = "bold fg:fg bg:directory"
format = "([](fg:prev_bg bg:directory)[  $path$read_only ]($style))"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold fg:fg bg:git_branch"
format = "([](fg:prev_bg bg:git_branch)[ $symbol$branch ]($style))"
symbol = " "

[git_status]
style  = "bold fg:fg bg:git_status"
format = "([](fg:prev_bg bg:git_status)[ $all_status$ahead_behind ]($style))"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold fg:fg bg:nodejs"
format = "([](fg:nodejs bg:prev_bg)[ $symbol$version ]($style))"
symbol   = " "
disabled = false

[python]
style  = "bold fg:fg bg:python"
format = "([](fg:python bg:prev_bg)[ $symbol$version( \\($virtualenv\\)) ]($style))"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold fg:fg bg:cmd_duration"
format = "([](fg:cmd_duration bg:prev_bg)[ $duration ]($style))"

[time]
style  = "bold fg:fg bg:time"
format = "([](fg:time bg:prev_bg)[ $time ]($style))"
disabled    = false
time_format = "%H:%M"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.pastel]
fg             = "#2e2e3e"
ok             = "#a8e6a1"
err            = "#ffadad"
