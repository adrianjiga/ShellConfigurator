# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$directory$git_branch$git_status\n$character"
add_newline  = true
palette      = "mono"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = "on "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[palettes.mono]
fg             = "black"
ok             = "white"
err            = "red"
username       = "bright-black"
hostname       = "bright-black"
directory      = "white"
git_branch     = "bright-black"
git_status     = "red"
nodejs         = "bright-black"
python         = "bright-black"
rust           = "bright-black"
docker_context = "bright-black"
kubernetes     = "bright-black"
aws            = "bright-black"
time           = "bright-black"
battery        = "bright-black"
cmd_duration   = "bright-black"
jobs           = "bright-black"
