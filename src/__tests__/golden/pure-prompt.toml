# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$directory$git_branch$fill$cmd_duration\n$character"
add_newline  = true
palette      = "pure"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = "on "

[cmd_duration]
style  = "bold cmd_duration"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.pure]
fg             = "#1c1c1c"
ok             = "#af5fff"
err            = "#ff5f5f"
username       = "#6c6c6c"
hostname       = "#6c6c6c"
directory      = "#0087d7"
git_branch     = "#6c6c6c"
git_status     = "#6c6c6c"
nodejs         = "#5faf5f"
python         = "#d7af5f"
rust           = "#d75f5f"
docker_context = "#0087d7"
kubernetes     = "#00afaf"
aws            = "#d7af5f"
time           = "#6c6c6c"
battery        = "#5faf5f"
cmd_duration   = "#d7af00"
jobs           = "#6c6c6c"
