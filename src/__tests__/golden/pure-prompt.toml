# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format              = "$directory$git_branch$fill$cmd_duration\n$character"
continuation_prompt = "[∙](bright-black) "
add_newline         = true
palette             = "pure"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = ""

[cmd_duration]
style  = "bold cmd_duration"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.pure]
fg             = "#1c1c1c"
ok             = "#af5fff"
err            = "#ff5f5f"
username       = "#6c6c6c"
hostname       = "#6c6c6c"
