# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format              = "$directory$git_branch$git_status$fill$nodejs$python$cmd_duration\n$character"
continuation_prompt = "[∙](bright-black) "
add_newline         = true
palette             = "tokyo-night"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true
format = "[ ]($style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style  = "bold git_branch"
symbol = " "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold nodejs"
symbol   = " "
disabled = false

[python]
style  = "bold python"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold cmd_duration"

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.tokyo-night]
fg             = "#1a1b26"
ok             = "#9ece6a"
err            = "#f7768e"
username       = "#ff9e64"
hostname       = "#e0af68"
