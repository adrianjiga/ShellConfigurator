# Generated by ShellConfigurator
# https://github.com/adrianjiga/ShellConfigurator

format       = "$directory$git_branch$git_status$fill$nodejs$python$cmd_duration\n$character"
add_newline  = true
palette      = "tokyo-night"

[directory]
style  = "bold directory"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
style  = "bold git_branch"
symbol = " "

[git_status]
style  = "bold git_status"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[nodejs]
style  = "bold nodejs"
symbol   = " "
disabled = false

[python]
style  = "bold python"
symbol   = " "
disabled = false

[cmd_duration]
style  = "bold cmd_duration"
min_time = 0

[character]
success_symbol = '[❯](bold ok)'
error_symbol   = '[❯](bold err)'

[fill]
symbol = " "

[palettes.tokyo-night]
fg             = "#1a1b26"
ok             = "#9ece6a"
err            = "#f7768e"
username       = "#ff9e64"
hostname       = "#e0af68"
directory      = "#7aa2f7"
git_branch     = "#bb9af7"
git_status     = "#f7768e"
nodejs         = "#9ece6a"
python         = "#e0af68"
rust           = "#ff9e64"
docker_context = "#7dcfff"
kubernetes     = "#2ac3de"
aws            = "#e0af68"
time           = "#a9b1d6"
battery        = "#9ece6a"
cmd_duration   = "#e0af68"
jobs           = "#bb9af7"
